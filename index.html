<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050a12">
<meta name="application-name" content="WORD RUN">
<meta name="apple-mobile-web-app-title" content="WORD RUN">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="WORD RUN — read fast, pick right, outrun the Redline. Endless word runner for web and mobile.">
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="icon" href="./icons/wordrun-192.png?v=3" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3">
<title>WORD RUN</title>
<style>
  :root{--ink:#dff2fc;--pale:#edf5fa;--steel:#5b7181;--ice:#67d8ff;--red:#ff2a1f;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#050a12;color:var(--ink);font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
  #app{position:fixed;inset:0;isolation:isolate}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #grade{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(180deg,rgba(3,6,10,.32),transparent 22%,transparent 62%,rgba(2,4,8,.38)),radial-gradient(90% 70% at 50% 36%,transparent 58%,rgba(2,5,9,.22) 100%)}

  #hud{position:absolute;inset:0;z-index:20;pointer-events:none;padding:calc(var(--safe-t) + 16px) 18px calc(var(--safe-b) + 18px);display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity .25s ease}
  #hud.on{opacity:1}.row{display:flex;align-items:flex-start;justify-content:space-between}
  #dist{font-size:clamp(34px,9.5vw,58px);font-weight:800;line-height:.9;letter-spacing:-.055em;color:#e8f7ff;text-shadow:0 0 14px rgba(103,216,255,.35),0 1px 2px rgba(2,6,10,.85);font-variant-numeric:tabular-nums}
  #dist small{font-size:.28em;font-weight:700;opacity:.42;margin-left:.4em;letter-spacing:.08em}
  #best{text-align:right;margin-right:42px;font-size:9px;line-height:1.45;letter-spacing:.16em;text-transform:uppercase;color:#9fb6c4;opacity:.8;font-variant-numeric:tabular-nums}
  #best b{display:block;margin-top:1px;font-size:13px;letter-spacing:.02em;color:#e8f7ff}
  #chain{display:none!important}
  .meter-zone{display:flex;flex-direction:column;gap:8px}
  #meterWrap{width:100%;height:4px;position:relative;overflow:hidden;background:rgba(103,216,255,.14);box-shadow:0 0 8px rgba(103,216,255,.18);transition:height .16s ease,box-shadow .16s ease,background .16s ease}
  #meterWrap::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 82%,rgba(255,255,255,.46));opacity:0;transition:opacity .16s ease}
  #meterWrap.armed{height:7px;background:rgba(28,49,61,.26);box-shadow:0 0 18px rgba(103,216,255,.34)}
  #meterWrap.armed::after{opacity:1}#meter{height:100%;width:0%;background:linear-gradient(90deg,#497d93,var(--ice),#ecfbff);transition:width .07s linear}
  #meterWrap.spending{box-shadow:0 0 28px rgba(103,216,255,.72)}#meterWrap.spending #meter{background:linear-gradient(90deg,#dff8ff,#fff)}

  #bandName,#pitchName,#courage,#styleWord,#coach,#powerHint{position:absolute;z-index:24;pointer-events:none;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
  #bandName{top:calc(var(--safe-t) + 15%);opacity:0;font-size:clamp(18px,5vw,28px);font-weight:800;letter-spacing:.34em;margin-left:.17em;color:rgba(223,242,252,.85);text-shadow:0 0 18px rgba(103,216,255,.35);transition:opacity .5s ease,transform .65s cubic-bezier(.2,.8,.2,1);transform:translateX(-50%) translateY(7px)}
  #bandName.on{opacity:.8;transform:translateX(-50%) translateY(0)}
  #pitchName,#courage,#styleWord{display:none!important}
  #coach{bottom:calc(var(--safe-b) + 70px);opacity:0;font-size:9px;font-weight:800;letter-spacing:.21em;color:rgba(238,248,252,.9);text-shadow:0 2px 10px rgba(8,13,18,.6);transition:opacity .25s ease}
  #coach.on{opacity:.9}
  #powerHint{bottom:calc(var(--safe-b) + 42px);opacity:0;font-size:9px;font-weight:900;letter-spacing:.28em;color:#dff9ff;text-shadow:0 0 16px rgba(103,216,255,.52);transition:opacity .2s ease}
  #powerHint.on{opacity:.84}#powerHint.spending{opacity:1}

  #dread{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;background:radial-gradient(150% 62% at 50% 100%,rgba(4,6,8,.96) 0%,rgba(4,6,8,0) 70%),radial-gradient(68% 52% at 1% 98%,rgba(3,4,6,.84) 0%,transparent 72%),radial-gradient(68% 52% at 99% 98%,rgba(3,4,6,.84) 0%,transparent 72%)}
  #dreadRed{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(135% 90% at 50% 118%,rgba(255,42,31,.5) 0%,rgba(255,42,31,0) 58%);mix-blend-mode:multiply}
  #tell{position:absolute;inset:0;z-index:12;pointer-events:none;opacity:0;box-shadow:inset 0 -150px 110px -52px rgba(255,42,31,.82);transition:opacity .06s linear}
  #fur{position:absolute;z-index:10;left:-9%;right:-9%;bottom:-2%;height:31%;pointer-events:none;opacity:0;transform-origin:50% 100%;background:repeating-linear-gradient(0deg,rgba(2,4,7,.95) 0 2px,transparent 2px 5px),repeating-linear-gradient(90deg,rgba(103,216,255,.16) 0 1px,transparent 1px 17px),repeating-linear-gradient(0deg,rgba(255,42,31,.10) 0 1px,transparent 1px 9px);animation:p4jitter .24s steps(3) infinite;-webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 42%,transparent 94%);mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 42%,transparent 94%)}
  #staticVeil{position:absolute;inset:-2%;z-index:7;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(159,216,255,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(2,5,9,.35) 0 2px,transparent 2px 4px);animation:p4veil .3s steps(4) infinite}
  @keyframes p4jitter{0%{background-position:0 0,0 0,0 0}50%{background-position:0 3px,-5px 0,0 -2px}100%{background-position:0 -2px,3px 0,0 1px}}
  @keyframes p4veil{0%{background-position:0 0,0 0}50%{background-position:0 2px,3px 0}100%{background-position:0 -1px,-2px 0}}
  #flash{position:absolute;inset:0;z-index:30;pointer-events:none;background:#fff;opacity:0}
  /* The drain (Phase 9): a wrong tap pulls the light out of the world for a
     beat — desaturation + a dim, not a bright crash. Loss reads as darkness;
     red stays the Redline's. */
  #drain{position:absolute;inset:0;z-index:28;pointer-events:none;background:#7d828a;opacity:0;mix-blend-mode:saturation}
  #drainDim{position:absolute;inset:0;z-index:28;pointer-events:none;background:rgba(7,10,15,.85);opacity:0}

  .screen{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 26px);text-align:center;opacity:0;visibility:hidden;transition:opacity .32s ease,visibility .32s;pointer-events:none}
  .screen.on{opacity:1;visibility:visible}
  #titleScreen{justify-content:space-between;background:linear-gradient(180deg,rgba(2,5,9,.42) 0%,transparent 34%,transparent 58%,rgba(2,5,9,.56) 100%)}
  .title-lockup{margin-top:max(9vh,58px)}
  #titleWordmark{display:block;width:min(82vw,1020px);height:auto;max-height:clamp(82px,19vw,218px);margin:0 auto;object-fit:contain;filter:drop-shadow(0 0 22px rgba(103,216,255,.35))}
  #titleHint{margin-top:16px;font-size:10px;font-weight:800;letter-spacing:.28em;color:rgba(190,220,236,.6)}
  .drop-lockup{margin-bottom:2vh}.drop{font-size:14px;font-weight:900;letter-spacing:.34em;margin-right:-.34em;color:rgba(242,251,255,.94);text-shadow:0 2px 16px rgba(6,12,16,.58);animation:pulse 1.8s ease-in-out infinite}
  .drop small{display:block;margin-top:8px;font-size:8px;font-weight:700;letter-spacing:.19em;color:rgba(238,248,252,.58)}.seed{margin-top:15px;font-size:8px;letter-spacing:.19em;color:rgba(235,247,252,.46)}
  @keyframes pulse{0%,100%{opacity:.46}50%{opacity:1}}

  #deathScreen{gap:11px;overflow:hidden;background:linear-gradient(180deg,rgba(7,11,15,.18),rgba(7,11,15,.82));color:#f2f8fb;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  #shot{display:none}#deathTag{margin-top:3px;font-size:10px;font-weight:900;letter-spacing:.34em;color:rgba(244,250,253,.72)}
  .big{font-size:clamp(58px,17vw,104px);font-weight:900;line-height:.86;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 20px rgba(0,0,0,.28)}
  .big small{font-size:.24em;font-weight:700;opacity:.43;margin-left:.36em;letter-spacing:.08em}.pb{color:#8be4ff;font-size:9px;letter-spacing:.28em;font-weight:900}
  .stats,#deathSeed{display:none!important}

  /* Daily goals + play streak (title) and the run recap (death card). */
  #titleGoals{margin-top:13px;display:flex;flex-direction:column;gap:7px;align-items:center}
  #titleStreak{font-size:9px;font-weight:900;letter-spacing:.26em;color:#8be4ff;text-shadow:0 0 12px rgba(103,216,255,.35)}
  .goalRow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .goalChip{font-size:8px;font-weight:800;letter-spacing:.14em;padding:5px 9px;border:1px solid rgba(255,255,255,.16);border-radius:2px;color:rgba(235,247,252,.62);background:rgba(10,18,24,.42)}
  .goalChip.done{color:#a8ecff;border-color:rgba(103,216,255,.55);box-shadow:0 0 12px rgba(103,216,255,.16);background:rgba(18,42,54,.5)}
  .goalChip.done::before{content:'✓ ';font-weight:900}
  #deathRecap{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:min(86vw,340px)}
  #deathRecap .metaLine{font-size:8px;font-weight:800;letter-spacing:.2em;color:rgba(235,247,252,.55)}
  #deathRecap .missHead{font-size:8px;font-weight:900;letter-spacing:.26em;color:rgba(244,250,253,.5);margin-top:2px}
  #deathRecap .miss{font:700 12px/1.35 ui-monospace,monospace;letter-spacing:.04em;color:rgba(240,249,253,.88)}
  #deathRecap .miss b{color:#a8ecff;font-weight:900}
  #deathRecap .miss s{color:rgba(255,159,150,.85);text-decoration-thickness:2px}
  #deathRecap .miss small{font-size:8px;font-weight:800;letter-spacing:.16em;color:rgba(235,247,252,.5);margin-left:6px}
  .btn{pointer-events:auto;border:1px solid rgba(255,255,255,.2);border-radius:2px;padding:10px 17px;cursor:pointer;background:rgba(255,255,255,.07);color:#eef7fb;font-family:inherit;font-size:9px;font-weight:800;letter-spacing:.18em;min-width:92px}
  .btn:active{background:rgba(255,255,255,.16)}.btn.primary{background:rgba(240,248,252,.92);color:#10171d;border-color:rgba(255,255,255,.55)}
  #deathActions{display:flex;gap:9px;margin-top:3px}#shotBtns{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(var(--safe-b) + 14px)}#saveShot{min-width:auto;padding:8px 10px;font-size:8px;opacity:.7}

  #mute{position:absolute;z-index:80;top:calc(var(--safe-t) + 9px);right:9px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(159,216,255,.1);color:#cfe9f7;font-size:14px;cursor:pointer;pointer-events:auto;display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  @media(min-width:760px) and (orientation:landscape){#hud{padding-left:28px;padding-right:28px}#meterWrap{max-width:560px;margin:0 auto}.title-lockup{margin-top:8vh}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="grade"></div>
  <div id="staticVeil"></div><div id="dread"></div><div id="dreadRed"></div><div id="fur"></div><div id="tell"></div><div id="flash"></div><div id="drain"></div><div id="drainDim"></div>
  <div id="bandName"></div><div id="pitchName"></div><div id="courage"></div><div id="styleWord"></div><div id="coach"></div><div id="powerHint"></div>

  <div id="hud">
    <div><div class="row"><div id="dist">0<small>M</small></div><div id="best"><span>BEST TODAY</span><b id="bestVal">—</b></div></div><div id="chain"></div></div>
    <div class="meter-zone"><div id="meterWrap"><div id="meter"></div></div></div>
  </div>

  <button id="mute" aria-label="Toggle sound">♪</button>

  <div class="screen on" id="titleScreen">
    <div class="title-lockup"><img id="titleWordmark" src="./ui/wordrun-wordmark.svg?v=2" alt="WORD RUN"><div id="titleHint">HOW FAR CAN YOU GO?</div></div>
    <div class="drop-lockup"><div class="drop">DROP IN<small>TAP · SPACE · ENTER</small></div><div id="titleGoals"><div id="titleStreak"></div><div class="goalRow" id="titleGoalRow"></div></div><div class="seed" id="seedLine"></div></div>
  </div>

  <div class="screen" id="deathScreen">
    <img id="shot" alt="The moment you were redacted">
    <div id="deathTag">REDACTED</div>
    <div class="big"><span id="finalDist">0</span><small>M</small></div>
    <div class="pb" id="pbTag" style="visibility:hidden">NEW BEST</div>
    <div id="deathRecap"></div>
    <div class="stats" id="deathStats"></div>
    <div id="deathActions"><button class="btn primary" id="deathAgain" data-rc2-ui>AGAIN</button><button class="btn" id="deathMenu" data-rc2-ui>MENU</button></div>
    <div id="shotBtns"><button class="btn" id="saveShot" data-rc2-ui>SAVE</button></div>
    <div class="seed" id="deathSeed"></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
<script type="module" src="/src/v1-mobile-ui.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
