<link rel="preload" href="./fonts/atkinson-next-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/fraunces-italic-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/big-shoulders-display-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<title>DICTION DASH</title>
<style>
  /* Type (Phase 20). Both faces are latin-subset variable WOFF2 served from
     this origin — a font CDN would be the build's only external request and
     zero is a hard requirement, but self-hosting was always allowed and the
     system-stack compromise cost the game its identity on every device.
       --face   Archivo. Display and UI: distance readout, buttons, the tiny
                widely-tracked labels that make the lower-third grammar work.
       --plate  Atkinson Hyperlegible Next, drawn by the Braille Institute so
                I/l/1, O/0 and rn/m cannot be confused. This game asks players
                to spot one wrong letter under time pressure, so on the word
                plates glyph disambiguation is a mechanic, not a preference.
       --title  Fraunces (soft), italic. The FINISH announcement. It shares
                no letter shapes with the plates, so it never reads as a word.
                The title wordmark stays Archivo with its chevron A.
       --num    Big Shoulders Display. The big numerals only (distance,
                combo, final distance): tall, narrow, street-sign figures.
       --mono   kept ONLY where glyphs must not shift between frames.
     Licences and provenance: public/fonts/README.md. */
  @font-face{font-family:'Archivo';src:url(./fonts/archivo-latin-var.woff2) format('woff2');font-weight:400 900;font-style:normal;font-display:block}
  @font-face{font-family:'Atkinson Hyperlegible Next';src:url(./fonts/atkinson-next-latin-var.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:block}
  @font-face{font-family:'Fraunces';src:url(./fonts/fraunces-italic-latin-var.woff2) format('woff2');font-weight:100 900;font-style:italic;font-display:block}
  @font-face{font-family:'Big Shoulders Display';src:url(./fonts/big-shoulders-display-latin-var.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:block}
  :root{--ink:#dff2fc;--pale:#edf5fa;--steel:#5b7181;--ice:#67d8ff;--red:#ff2a1f;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
    --face:'Archivo',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --plate:'Atkinson Hyperlegible Next',Verdana,"DejaVu Sans",Arial,sans-serif;
    --title:'Fraunces',Georgia,"Times New Roman",serif;
    --num:'Big Shoulders Display',"Arial Narrow",'Archivo',sans-serif;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    /* THE TYPE SYSTEM (playtest 10/8: "it feels like five fonts"). Three
       tiers, each with one job: Fraunces calls FINISH,
       Big Shoulders sets the big numerals, Archivo carries every other
       interface line, and Atkinson Hyperlegible owns the word plate alone.
       Archivo keeps three weights — 800 strong, 600 quiet, 400 prose —
       and four tracking steps for caps: .08 / .16 / .24 / .34em (numerals keep
       their own negative tightening). A new rule picks from these. */
    --tag:.34em;      /* label tracking */
    --dim:rgba(232,244,251,.42);
    --dimmer:rgba(232,244,251,.28)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#050a12;color:var(--ink);font-family:var(--face);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
  #app{position:fixed;inset:0;isolation:isolate}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #grade{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(180deg,rgba(3,6,10,.32),transparent 22%,transparent 62%,rgba(2,4,8,.38)),radial-gradient(90% 70% at 50% 36%,transparent 58%,rgba(2,5,9,.22) 100%)}

  #hud{position:absolute;inset:0;z-index:20;pointer-events:none;padding:calc(var(--safe-t) + 16px) 18px calc(var(--safe-b) + 18px);display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity .25s ease}
  #hud.on{opacity:1}.row{display:flex;align-items:flex-start;justify-content:space-between}
  #dist{font-family:var(--num);font-size:clamp(46px,13.5vw,80px);font-weight:900;line-height:.86;letter-spacing:-.01em;color:#f4fbff;text-shadow:0 0 18px rgba(103,216,255,.3),0 1px 2px rgba(2,6,10,.85)}
  #distSub{margin-top:3px;font-size:10px;font-weight:800;letter-spacing:.24em;color:var(--dim)}
  /* RC9.2 — the score to beat, on a challenge run and nowhere else. A second
     quiet figure under the metre caption: smaller than the caption, so it
     never competes with the score it is measured against, and it turns the
     semantic right-read colour the instant it is passed. That flip is the
     whole point of putting it on the HUD rather than on the card. */
  #distTarget{display:none;margin-top:2px;font-size:9px;font-weight:800;letter-spacing:.24em;
    color:var(--dimmer);transition:color .2s ease}
  #distTarget.on{display:block}
  #distTarget.passed{color:var(--sem-right,#57e389)}
  /* Playtest: the hearts sat at a fixed offset from the top while the score
     above them is clamp(38px..66px) tall, so on a wide viewport the headline
     grew straight through them. They live in the column's flow now and cannot
     collide with it at any size. */
  #vitalsSlot{margin-top:10px;min-height:22px}
  /* Hearts — the fail state, one pip per life. Built and driven by ui.js
     (Phase 0: relocated here from the deleted rc5.js style injection). The
     danger colour is overridden per colour-vision palette in ui/access.js. */
  #vitals{display:flex;align-items:center;gap:7px;pointer-events:none;transition:opacity .18s ease}
  /* Phase L HUD pass: hearts leave saturated red — that hue is the
     Redline's alarm, and two reds on one screen taught the wrong lesson.
     Soft rose (hue 315°) clears every RESERVED_HUES entry by ≥ 35° and
     still reads as vitality by shape; the gate holds the separation. */
  /* RC6.2: drawn, not typeset. Stroke + fill at a fixed 22px, so the shape
     is identical on every platform instead of whatever '♥' each symbol font
     happens to draw. The rose (hue ~322) clears every RESERVED_HUES entry —
     the gate holds that separation, as it did for the glyph. */
  .heartPip{width:22px;height:22px;overflow:visible;opacity:.97;transition:opacity .18s ease,transform .18s ease}
  .heartPip .hFill{fill:#ec98d7;filter:drop-shadow(0 2px 6px rgba(70,20,60,.35))}
  .heartPip .hLine{fill:none;stroke:#ffd9f1;stroke-width:1.4;opacity:.5}
  /* The clean streak, filling the next empty heart from its base. */
  .heartPip .hStreak{fill:#ec98d7;opacity:.42}
  .heartPip.empty .hFill{fill:rgba(236,152,215,.13)}
  .heartPip.empty .hLine{stroke:rgba(255,217,241,.34);opacity:1}
  .heartPip.empty{transform:scale(.9)}
  /* RC13.6 — hearts as lit cabinet lamps: a glow in their own rose, a
     specular crown, and the lamp that goes out bursts once as it does. */
  .heartPip .hFill{filter:drop-shadow(0 0 6px rgba(236,152,215,.55)) drop-shadow(0 2px 4px rgba(70,20,60,.35))}
  .heartPip .hGloss{fill:#fff;opacity:.55}
  .heartPip.empty .hGloss{opacity:.08}
  .heartPip.lost{animation:heartOut .42s ease-out}
  @keyframes heartOut{0%{transform:scale(1.35);filter:drop-shadow(0 0 14px rgba(255,217,241,.95))}100%{transform:scale(.9);filter:none}}
  #vitals.pulse .heartPip:not(.empty){animation:heartPulse .38s ease}
  @keyframes heartPulse{0%{transform:scale(1)}35%{transform:scale(1.26)}100%{transform:scale(1)}}
  /* RC-5: the run HUD does not carry a second score. BEST lives in
     PROFILE, where a player goes to look at their record — not over the
     word they are reading. The node stays (the results card and PROFILE
     both write it) and is simply never shown in the run. */
  #best[hidden]{display:none}
  #best{text-align:right;margin-right:42px;font-size:8px;line-height:1.5;letter-spacing:var(--tag);text-transform:uppercase;color:var(--dim)}
  #best b{display:block;margin-top:2px;font-size:15px;font-weight:800;letter-spacing:-.02em;color:#e8f7ff}
  /* RC11.4 — THE JUDGMENT AND THE CHAIN, at arcade weight.

     `#chain` was written every frame by ui.js behind `display:none!important`,
     and the break path that would have animated it had no caller at all. Both
     are gone; `ui/judgment.js` owns this readout now, and these are its two
     elements.

     PLACEMENT IS A CONSTRAINT, AND IT WAS MEASURED, NOT PICKED. The first
     attempt put the judgment at 46 % — "under the plate" by eye, and wrong: a
     plate TRAVELS, so a fixed band either clears its whole corridor or it does
     not clear it at all. Sampled over 2400 frames at 390x844, the armed plate
     sweeps 254-473 px (30-56 % of the viewport) and the lookahead row 234-408
     px. 46 % is inside both. The judgment therefore sits at 68 %, below the
     corridor's floor with 70 px to spare, above the touch controls, and it
     stands down entirely while a stop or a coach line is speaking. The chain
     rides the HUD's own left column at 108 px, clear of the corridor's 234 px
     ceiling, where the eye already goes for the score.

     Colours are `--sem-right` / `--sem-wrong`: the semantic pair access.js
     redefines per colour-vision mode, so no new hue is introduced and none
     needs checking against the reserved set. */
  #judgeBurst{position:absolute;inset:0;z-index:24;pointer-events:none}
  #judge{position:absolute;left:50%;top:var(--judge-top,68%);transform:translate(-50%,-50%);z-index:26;
    pointer-events:none;opacity:0;font:800 var(--judge-size,clamp(30px,9vw,52px))/1 var(--face);
    letter-spacing:.16em;margin-right:-.16em;color:var(--sem-right,#57e389);
    text-shadow:0 2px 18px rgba(4,9,13,.85),0 0 26px currentColor;
    transition:opacity .18s ease}
  #judge.on{opacity:1}
  #judge[data-kind="wrong"]{color:var(--sem-wrong,#ff2a1f)}
  /* The true spelling under a tapped fake: plate face, quiet ink, the
     changed letters in the right-read colour. */
  #judge .judgeTrue{display:block;text-align:center;margin-right:-.16em;margin-top:.32em;font:700 .56em/1 var(--plate);letter-spacing:.04em;text-transform:lowercase;color:#eef7fb;text-shadow:0 2px 14px rgba(4,9,13,.9)}
  #judge .judgeTrue b{color:var(--sem-right,#57e389);font-weight:800}
  #judge[data-kind="pass"]{color:rgba(232,244,251,.72);text-shadow:0 2px 14px rgba(4,9,13,.8)}
  #judge.punch{animation:judgePunch var(--judge-punch-ms,170ms) cubic-bezier(.2,1.5,.4,1)}
  @keyframes judgePunch{
    0%{transform:translate(-50%,-50%) scale(var(--judge-punch-scale,1.5))}
    100%{transform:translate(-50%,-50%) scale(1)}}

  #combo{position:absolute;left:16px;top:calc(var(--safe-t) + var(--combo-top,108px));z-index:25;
    pointer-events:none;opacity:0;
    font:900 calc(var(--combo-size,clamp(26px,7vw,40px)) * 1.2)/1 var(--num);letter-spacing:0;
    color:var(--sem-right,#57e389);text-shadow:0 2px 14px rgba(4,9,13,.8),0 0 20px currentColor;
    transition:opacity .2s ease;font-variant-numeric:tabular-nums}
  #combo.on{opacity:.96}
  /* Playtest 10/8 — the press tell: a light bar on the pressed edge, the
     instant the answer lands. Neutral (not the verdict's colour); REDUCED
     FLASH keeps it, dimmer and without the bloom. */
  #pressTell{position:absolute;top:0;bottom:0;width:7px;z-index:27;pointer-events:none;opacity:0;
    background:linear-gradient(180deg,transparent,rgba(232,250,255,.95) 30%,rgba(232,250,255,.95) 70%,transparent);
    box-shadow:0 0 22px 4px rgba(160,236,255,.55)}
  #pressTell[data-side="l"]{left:0}
  #pressTell[data-side="r"]{right:0}
  #pressTell.on{animation:pressTell .28s ease-out}
  #app.calm #pressTell{box-shadow:none}
  #app.calm #pressTell.on{animation:pressTellCalm .28s ease-out}
  @keyframes pressTell{0%{opacity:1;width:12px}100%{opacity:0;width:5px}}
  @keyframes pressTellCalm{0%{opacity:.6}100%{opacity:0}}
  /* RC13.6 — the DAILY RUN's route as a lit track along the top edge: how far
     through the hundred words, at a glance, without a number to read. The
     fill is a transform (no layout), cabinet cyan, with a hot head. */
  #routeStrip{position:absolute;left:0;right:0;top:var(--safe-t);height:3px;z-index:21;pointer-events:none;
    background:rgba(232,244,251,.10);opacity:0;transition:opacity .25s ease}
  #routeStrip.on{opacity:1}
  #routeStrip i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(var(--route,0));
    background:linear-gradient(90deg,rgba(103,216,255,.35),rgba(103,216,255,.95));
    box-shadow:0 0 10px rgba(103,216,255,.6);transition:transform .35s cubic-bezier(.2,.8,.3,1)}
  /* RC13.6 — the count-in. Above the plate corridor (which starts at 28 %),
     over the launch veil (it is part of the ceremony). GO wears the
     semantic right-read colour; the numbers are the HUD's own white. */
  #launchCount{position:fixed;left:50%;top:20%;z-index:71;pointer-events:none;opacity:0;
    transform:translate(-50%,-50%);font:800 clamp(64px,22vw,140px)/1 var(--face);letter-spacing:-.03em;
    color:#f4fbff;text-shadow:0 0 30px rgba(103,216,255,.55),0 3px 18px rgba(2,6,10,.8)}
  #launchCount[data-go="1"]{color:var(--sem-right,#57e389);letter-spacing:.08em;text-shadow:0 0 34px currentColor,0 3px 18px rgba(2,6,10,.8)}
  #launchCount.beat{animation:countBeat var(--beat,.42s) cubic-bezier(.2,1.4,.4,1) forwards}
  #launchCount.beat.still{animation:countStill var(--beat,.42s) linear forwards}
  @keyframes countBeat{0%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}22%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.92)}}
  @keyframes countStill{0%,80%{opacity:1}100%{opacity:0}}
  /* RC13.5 — score pops: a read's points fly off the judgment into the
     headline, which kicks when they land. Semantic colour, no new hue. */
  .scorePop{position:absolute;left:0;top:0;z-index:25;pointer-events:none;opacity:0;
    font:800 clamp(18px,5vw,28px)/1 var(--face);letter-spacing:-.01em;color:var(--sem-right,#57e389);
    text-shadow:0 2px 12px rgba(4,9,13,.85),0 0 16px currentColor;transform:translate(var(--sx),var(--sy)) translate(-50%,-50%)}
  .scorePop.fly{animation:scorePop var(--pop-s,.62s) cubic-bezier(.5,0,.75,.4) forwards}
  @keyframes scorePop{
    0%{opacity:0;transform:translate(var(--sx),var(--sy)) translate(-50%,-50%) scale(.6)}
    16%{opacity:1;transform:translate(var(--sx),calc(var(--sy) - 18px)) translate(-50%,-50%) scale(1.15)}
    34%{opacity:1;transform:translate(var(--sx),calc(var(--sy) - 22px)) translate(-50%,-50%) scale(1)}
    100%{opacity:.2;transform:translate(var(--tx),var(--ty)) translate(-50%,-50%) scale(.45)}}
  #dist{transform-origin:0 60%}
  #dist.kick{animation:distKick .2s cubic-bezier(.2,1.6,.4,1)}
  @keyframes distKick{0%{transform:scale(1.09)}100%{transform:scale(1)}}
  #combo.lost{opacity:.9;color:var(--sem-wrong,#ff2a1f);animation:comboBreak .5s ease-out}
  #combo.punch{animation:comboPunch var(--combo-punch-ms,160ms) cubic-bezier(.2,1.6,.4,1)}
  @keyframes comboPunch{0%{transform:scale(var(--combo-punch-scale,1.42))}100%{transform:scale(1)}}
  @keyframes comboBreak{0%{transform:translateX(0)}
    22%{transform:translateX(-5px)}55%{transform:translateX(4px)}100%{transform:translateX(0)}}

  /* RC11.4 — the DASH reads as an EVENT, not a state change. A full meter
     breathes on the label; a live dash lights the whole frame's edge. The
     flare is one element, additive, and REDUCED FLASH takes the animation
     off both while leaving the colour that carries the information. */
  #dashFlare{position:absolute;inset:0;z-index:23;pointer-events:none;opacity:0;
    transition:opacity .16s ease;
    box-shadow:inset 0 0 60px 12px rgba(103,216,255,.34),inset 0 0 160px 40px rgba(103,216,255,.16)}
  #dashFlare.on{opacity:1;animation:dashFlare .9s ease-in-out infinite}
  @keyframes dashFlare{0%,100%{opacity:.62}50%{opacity:1}}
  #meterLabel.ready{animation:meterReady 1.05s ease-in-out infinite}
  @keyframes meterReady{0%,100%{opacity:.72}50%{opacity:1}}
  /* The DASH charge (Phase 20). This was a smooth glowing hairline inherited
     from the shell — the same bar the source game used, and it said nothing
     about what it held. It is now a broadcast level meter: ten discrete
     charges, cut by a mask so the track and the fill segment identically,
     each cell worth ~0.3 s of dash. Emptying it reads as cells going out
     rather than a line receding, which is what actually happens. */
  .meter-zone{display:flex;flex-direction:column;gap:7px;--cells:10;--gap:3px}
  #meterLabel{display:flex;align-items:baseline;gap:8px;font-size:8px;font-weight:800;letter-spacing:var(--tag);text-transform:uppercase;color:var(--dimmer);transition:color .16s ease}
  #meterLabel i{flex:1;height:1px;background:currentColor;opacity:.3;font-style:normal}
  /* The bar the player set for themselves. Marks, never a word — the naming
     cap is four and this is not one of them. */
  /* RC8.1: and the marks are their own row now, not a tail on the meter
     label. Riding with the meter (RC6.2) put them at the bottom of a column
     the touch build hides, so on a phone they sat behind the 76px DASH
     button: a readout invisible on the device it was drawn for. They sit
     directly above that button instead — centred, three of them, lit per
     level, and shown only once the player has actually set one. */
  #barMarks{position:absolute;left:50%;transform:translateX(-50%);z-index:24;pointer-events:none;
    display:flex;gap:6px;opacity:0;transition:opacity .18s ease;
    bottom:calc(var(--safe-b) + 52px)}
  #barMarks.set{opacity:1}
  #barMarks i{width:16px;height:3px;background:rgba(139,228,255,.22);
    box-shadow:0 1px 6px rgba(4,9,13,.5);transition:background .18s ease,box-shadow .18s ease}
  #barMarks i.lit{background:#8be4ff;box-shadow:0 0 10px rgba(139,228,255,.7)}
  /* RC9.9 — a wrong read takes the bar back, and the marks collapse ON THE
     DRAIN'S OWN BEAT so it reads as the consequence of the read rather than
     as a HUD that changed while the screen was busy. The colour is the live
     ACCESS danger hue, the same one every other correction wears. */
  #barMarks.fell{opacity:1}
  #barMarks.fell i,#barMarks.fell i.lit{background:var(--sem-wrong,#ff7a7a);
    box-shadow:0 0 calc(14px * var(--drain,0)) var(--sem-wrong,#ff7a7a);
    transform:scaleX(calc(.30 + .70 * var(--drain,0)));transition:none}
  .meter-zone.armed #meterLabel{color:rgba(190,238,255,.85)}
  .meter-zone.spending #meterLabel{color:#fff}
  /* The one-shot flourish when the dash reaches full charge. */
  .meter-zone.justArmed #meter{animation:dashCharged .5s ease-out 1}
  .meter-zone.justArmed #meterLabel{animation:dashChargedLabel .5s ease-out 1}
  @keyframes dashCharged{0%{filter:drop-shadow(0 0 7px rgba(103,216,255,.5))}
    28%{filter:drop-shadow(0 0 22px rgba(190,245,255,.95)) brightness(1.5)}
    100%{filter:drop-shadow(0 0 7px rgba(103,216,255,.5))}}
  @keyframes dashChargedLabel{0%,100%{letter-spacing:var(--tag)}35%{letter-spacing:.5em;color:#fff}}

  #meterWrap{width:100%;height:7px;position:relative;background:rgba(103,216,255,.13);
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 calc(100%/var(--cells) - var(--gap)),transparent calc(100%/var(--cells) - var(--gap)) calc(100%/var(--cells)));
    mask-image:repeating-linear-gradient(90deg,#000 0 calc(100%/var(--cells) - var(--gap)),transparent calc(100%/var(--cells) - var(--gap)) calc(100%/var(--cells)));
    transition:height .16s ease,background .16s ease}
  .meter-zone.armed #meterWrap{height:10px;background:rgba(28,49,61,.3)}
  #meter{height:100%;width:0%;background:linear-gradient(90deg,#2f6d86,var(--ice) 62%,#bdefff);transition:width .07s linear}
  .meter-zone.armed #meter{background:linear-gradient(90deg,#3f90ad,var(--ice) 55%,#e6fbff);filter:drop-shadow(0 0 7px rgba(103,216,255,.5))}
  .meter-zone{--dashHue:195}
  .meter-zone.spending #meter{background:linear-gradient(90deg,hsl(var(--dashHue) 92% 86%),#fff);filter:drop-shadow(0 0 12px hsl(var(--dashHue) 95% 78% / .85))}

  #bandName,#coach,#powerHint{position:absolute;z-index:24;pointer-events:none;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
  /* RC8.1: the bar line says what the hold BUYS as well as what to hold, and
     at 11px/.24em that is wider than a 390px phone. The two teach-band lines
     wrap inside a reading measure instead of clipping off both edges; every
     shorter line still lands on one. */
  #coach,#powerHint{white-space:normal;max-width:min(86%,540px);line-height:1.45}
  #bandName{top:calc(var(--safe-t) + 15%);opacity:0;font-size:clamp(18px,5vw,28px);font-weight:800;letter-spacing:.34em;margin-left:.17em;color:rgba(223,242,252,.85);text-shadow:0 0 18px rgba(103,216,255,.35);transition:opacity .5s ease,transform .65s cubic-bezier(.2,.8,.2,1);transform:translateX(-50%) translateY(7px)}
  #bandName.on{opacity:.8;transform:translateX(-50%) translateY(0)}
  /* RC-3 playtest: teaching text at the bottom edge was invisible while the
     eyes live on the plate — ALL tutorial text now speaks from one place,
     the mid-screen teach band (the same 57% line the TEACH surface uses,
     below the plates, above the runner). The coach and TEACH never co-show,
     so the band is never contested. */
  #coach{top:57%;opacity:0;font-size:11px;font-weight:800;letter-spacing:.24em;color:rgba(238,248,252,.92);text-shadow:0 2px 12px rgba(8,13,18,.75);transition:opacity .25s ease}
  #coach.on{opacity:.9}
  /* The DASH's charged state (Phase 16). The old 9px hint at 0.84 opacity
     flashed for a beat and was, by measurement of its own tuning comment,
     missed entirely by players who never learned the mechanic existed.
     The `teaching` state — held while the dash is still unlearned — is
     deliberately loud: bigger, boxed, pulsing. REDUCED FLASH omits the
     class, so the instruction stays and only the pulse goes. */
  /* RC6.1: the third tutorial element. RC3 moved the coach to the teach
     band and RC5 centred the DASH button over this hint's old spot at the
     bottom edge — so it read as a caption on the button it was telling you
     to press. It joins the band the other two speak from; the coach
     already yields to it, so they still never share a frame. */
  #powerHint{top:57%;opacity:0;font-size:9px;font-weight:800;letter-spacing:.24em;color:#dff9ff;text-shadow:0 0 16px rgba(103,216,255,.52);transition:opacity .2s ease}
  #powerHint.on{opacity:.84}#powerHint.spending{opacity:1}
  #powerHint.teaching{opacity:1;font-size:11px;letter-spacing:.24em;padding:8px 14px;border:1px solid rgba(103,216,255,.55);background:rgba(8,20,28,.62);color:#eafcff;box-shadow:0 0 26px rgba(103,216,255,.34);animation:dashReady 1.15s ease-in-out infinite}
  @keyframes dashReady{0%,100%{box-shadow:0 0 18px rgba(103,216,255,.24);border-color:rgba(103,216,255,.4)}50%{box-shadow:0 0 34px rgba(103,216,255,.62);border-color:rgba(160,236,255,.9)}}

  #dread{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;background:radial-gradient(150% 62% at 50% 100%,rgba(4,6,8,.96) 0%,rgba(4,6,8,0) 70%),radial-gradient(68% 52% at 1% 98%,rgba(3,4,6,.84) 0%,transparent 72%),radial-gradient(68% 52% at 99% 98%,rgba(3,4,6,.84) 0%,transparent 72%)}
  #dreadRed{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(135% 90% at 50% 118%,rgba(255,42,31,.5) 0%,rgba(255,42,31,0) 58%);mix-blend-mode:multiply}
  #fur{position:absolute;z-index:10;left:-9%;right:-9%;bottom:-2%;height:31%;pointer-events:none;opacity:0;transform-origin:50% 100%;background:repeating-linear-gradient(0deg,rgba(2,4,7,.95) 0 2px,transparent 2px 5px),repeating-linear-gradient(90deg,rgba(103,216,255,.16) 0 1px,transparent 1px 17px),repeating-linear-gradient(0deg,rgba(255,42,31,.10) 0 1px,transparent 1px 9px);animation:p4jitter .24s steps(3) infinite;-webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 42%,transparent 94%);mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 42%,transparent 94%)}
  #staticVeil{position:absolute;inset:-2%;z-index:7;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(159,216,255,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(2,5,9,.35) 0 2px,transparent 2px 4px);animation:p4veil .3s steps(4) infinite}
  @keyframes p4jitter{0%{background-position:0 0,0 0,0 0}50%{background-position:0 3px,-5px 0,0 -2px}100%{background-position:0 -2px,3px 0,0 1px}}
  @keyframes p4veil{0%{background-position:0 0,0 0}50%{background-position:0 2px,3px 0}100%{background-position:0 -1px,-2px 0}}
  #flash{position:absolute;inset:0;z-index:30;pointer-events:none;background:#fff;opacity:0}
  /* The drain (Phase 9): a wrong tap pulls the light out of the world for a
     beat — desaturation + a dim, not a bright crash. Loss reads as darkness;
     red stays the Redline's. */
  #drain{position:absolute;inset:0;z-index:28;pointer-events:none;background:#7d828a;opacity:0;mix-blend-mode:saturation}
  #drainDim{position:absolute;inset:0;z-index:28;pointer-events:none;background:rgba(7,10,15,.85);opacity:0}

  .screen{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 26px);text-align:center;opacity:0;visibility:hidden;transition:opacity .32s ease,visibility .32s;pointer-events:none}
  .screen.on{opacity:1;visibility:visible}
  /* RC13.7 — the attract cycle: HIGH SCORES and HOW TO PLAY take the title's
     place in turn over the demo run; PRESS START blinks under all of it.
     Pointer-events none throughout — the first touch still ends attract. */
  #titleScreen{transition:opacity .45s ease}
  #titleScreen.attractAway{opacity:0}
  #attractPanels{position:absolute;inset:0;z-index:31;pointer-events:none;opacity:0;transition:opacity .4s ease}
  #attractPanels.on{opacity:1}
  #attractPanels .apCard{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(84%,380px);
    padding:22px 22px 18px;background:rgba(4,9,14,.78);border:1px solid rgba(103,216,255,.32);
    box-shadow:0 0 40px rgba(103,216,255,.16);opacity:0;transition:opacity .4s ease;text-align:center}
  #attractPanels .apCard.on{opacity:1}
  #attractPanels .apHead{font-size:15px;font-weight:800;letter-spacing:.34em;color:#eaf8ff;text-shadow:0 0 16px rgba(103,216,255,.55)}
  #attractPanels .apSub{margin-top:6px;font-size:8px;font-weight:800;letter-spacing:.24em;color:var(--dim)}
  #attractPanels ol{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:5px}
  #attractPanels li{display:grid;grid-template-columns:2em 3.4em 1fr;align-items:baseline;font-size:15px;font-weight:800;color:#dff4ff;font-variant-numeric:tabular-nums}
  #attractPanels li:first-child{color:#fff6c8;text-shadow:0 0 12px rgba(255,226,140,.5)}
  #attractPanels .apN{text-align:right;color:var(--dim);font-size:11px;padding-right:.6em}
  #attractPanels .apI{text-align:left;letter-spacing:.16em}
  #attractPanels .apS{text-align:right}
  #attractPanels p{margin-top:14px;font-size:10px;font-weight:800;letter-spacing:.16em;line-height:1.6;color:#dff4ff}
  #attractPanels .apStart{position:absolute;left:50%;bottom:calc(var(--safe-b) + 13%);transform:translateX(-50%);
    font-size:13px;font-weight:800;letter-spacing:.34em;margin-right:-.34em;color:#eaf8ff;
    text-shadow:0 0 18px rgba(103,216,255,.7);animation:apBlink 1.1s steps(1,end) infinite}
  #attractPanels .apStart.still{animation:none;opacity:.85}
  @keyframes apBlink{0%{opacity:1}55%{opacity:0}}
  #titleScreen{justify-content:space-between;background:linear-gradient(180deg,rgba(2,5,9,.5) 0%,transparent 30%,transparent 46%,rgba(2,5,9,.72) 68%,rgba(2,5,9,.92) 100%)}
  .title-lockup{margin-top:max(7vh,44px);align-self:stretch;width:100%}
  /* RC13.3 — THE TITLE AS KEY ART. The poster's two lines bracket the screen
     and the wordmark sits between them on two lines, the A drawn as the
     chevron of light. They are the lockup's, not the interface's: the copy
     gate budgets them on their own, beside the UI's dozen-word cap. */
  #titleStrap{font-size:clamp(9px,2.4vw,12px);font-weight:600;letter-spacing:.34em;margin-right:-.34em;color:rgba(214,236,246,.62);text-align:center;padding:0 0 max(14px,calc(var(--safe-b) + 10px));position:relative}
  .wmChevron{filter:drop-shadow(0 0 10px rgba(103,216,255,.95)) drop-shadow(0 0 28px rgba(103,216,255,.6))}
  #titleWordmark{display:block;width:min(84%,700px);height:auto;max-height:clamp(120px,36vw,300px);margin:0 auto;overflow:visible;filter:drop-shadow(0 0 18px rgba(103,216,255,.32))}
  #titleHint{margin-top:14px;font-size:8px;font-weight:600;letter-spacing:var(--tag);color:var(--dim)}
  .drop-lockup{margin-bottom:2vh;display:flex;flex-direction:column;align-items:center;gap:18px}
  /* The one thing to do on this screen, sized like it. */
  /* The start button, at arcade weight: a lit capsule that breathes. */
  .drop{font-size:clamp(15px,4.4vw,19px);font-weight:800;letter-spacing:.34em;color:#04121b;padding:15px 30px 15px calc(30px + .32em);border-radius:999px;background:linear-gradient(180deg,#e9f9ff,#8fe1ff);box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 0 26px rgba(103,216,255,.65),0 0 70px rgba(103,216,255,.28);animation:startGlow 1.8s ease-in-out infinite}
  @keyframes startGlow{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 0 22px rgba(103,216,255,.55),0 0 60px rgba(103,216,255,.22)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 0 34px rgba(103,216,255,.9),0 0 90px rgba(103,216,255,.4)}}
  @media (prefers-reduced-motion:reduce){.drop{animation:none}}
  #app.calm .drop{animation:none}
  .seed{font-size:8px;font-weight:600;letter-spacing:.24em;color:var(--dimmer)}
  /* RC9.2 — the dare. A challenge visit's title has exactly one thing to say
     and this is it, so it stops being styled like the seed string it replaced:
     brighter, larger, and the only caption on the screen. Still one line, and
     still not a name — the cap is four. */
  .seed.dare{font-size:11px;font-weight:800;letter-spacing:.24em;color:#bfeaff;
    text-shadow:0 0 18px rgba(103,216,255,.35);margin-top:2px}
  @keyframes pulse{0%,100%{opacity:.62}50%{opacity:1}}

  #deathScreen{gap:0;overflow:hidden;background:linear-gradient(180deg,rgba(7,11,15,.22),rgba(7,11,15,.88));color:#f2f8fb;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #shot{display:none}
  #deathTag{font-size:9px;font-weight:600;letter-spacing:.34em;margin-right:-.34em;color:var(--dim)}
  /* The score is the broadcast moment: nothing else on this card competes. */
  .big{margin-top:6px;font-family:var(--num);font-size:clamp(86px,28vw,170px);font-weight:900;line-height:.82;letter-spacing:-.01em;color:#fff;text-shadow:0 4px 28px rgba(0,0,0,.35)}
  /* Phase Q: the card enters in the flow band the run ended on — the
     headline's glow scales with --endFlow (0..1, set by renderDeath), and
     each beat of the count-up nudges it. REDUCED FLASH never adds .tick. */
  #deathScreen .big{text-shadow:0 4px 28px rgba(0,0,0,.35),0 0 calc(10px + 30px*var(--endFlow,0)) rgba(103,216,255,calc(.10 + .38*var(--endFlow,0)))}
  #deathScreen .big.tick{animation:countTick .22s ease-out}
  /* RC13.7 — the arcade tally: three figures counting in turn under the
     score, then the rank letter stamps in at the end of the row. */
  #tally{display:flex;align-items:center;justify-content:center;gap:clamp(14px,5vw,28px);margin-top:14px}
  #tally>span:not(#rankStamp){display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8px;font-weight:800;letter-spacing:.24em;color:var(--dim)}
  #tally b{font-size:clamp(20px,6vw,28px);font-weight:800;letter-spacing:-.02em;color:#eaf8ff;font-variant-numeric:tabular-nums}
  #rankStamp{min-width:1.15em;font-size:clamp(40px,12vw,58px);font-weight:800;line-height:1;text-align:center;color:#eaf8ff;opacity:0;
    text-shadow:0 0 22px rgba(103,216,255,.7)}
  #rankStamp.on{opacity:1;animation:rankStamp .34s cubic-bezier(.2,1.6,.4,1)}
  #rankStamp.still{animation:none}
  #rankStamp[data-r="S"]{color:#fff6c8;text-shadow:0 0 26px rgba(255,226,140,.85)}
  @keyframes rankStamp{0%{transform:scale(2.4) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg)}}
  #rankStamp.on:not(.still){transform:rotate(-6deg)}
  /* RC13.7 — ENTER YOUR INITIALS: three lit slots inline on the card. */
  #initialsRow{display:none;flex-direction:column;align-items:center;gap:8px;margin:14px 0 4px}
  #initialsRow.on{display:flex}
  #initialsRow .iHead{font-size:10px;font-weight:800;letter-spacing:.24em;color:#fff6c8;text-shadow:0 0 14px rgba(255,226,140,.55)}
  #initialsRow .iHead.done{color:var(--dim);text-shadow:none}
  #initialsRow .iRow{display:flex;align-items:center;gap:10px}
  #initialsRow .iSlot{display:flex;flex-direction:column;align-items:center;gap:2px}
  #initialsRow .iSlot b{width:44px;height:52px;display:grid;place-items:center;font-size:34px;font-weight:800;color:#eaf8ff;
    border:1px solid rgba(103,216,255,.3);background:rgba(8,20,28,.6)}
  #initialsRow .iSlot.cur b{border-color:rgba(160,236,255,.95);box-shadow:0 0 18px rgba(103,216,255,.45)}
  #initialsRow .iUp,#initialsRow .iDn{width:44px;height:26px;border:0;background:transparent;color:rgba(160,236,255,.85);font-size:12px;cursor:pointer}
  #initialsRow .iOk{margin-left:6px;min-width:0;padding:12px 14px}
  #initialsRow .iOk:disabled{opacity:.35}
  @keyframes countTick{0%{transform:scale(1.018)}100%{transform:scale(1)}}
  .big small{font-size:.2em;font-weight:600;opacity:.36;margin-left:.28em;letter-spacing:.08em}
  .pb{margin-top:10px;color:#8be4ff;font-size:9px;letter-spacing:.34em;margin-right:-.34em;font-weight:800}
  .stats,#deathSeed{display:none!important}
  /* PD-2: every overlay sheet enters with the same soft motion. */
  #accessPanel.on,#shopPanel.on,#curveScreen.on,#rc2Pause.on{animation:panelIn .18s ease}
  @keyframes panelIn{from{opacity:0}to{opacity:1}}

  /* Daily goals + play streak (title) and the run recap (death card). */
  /* Mode + difficulty chips (Phase 10). Buttons, so the tap-anywhere
     BEGIN RUN handler ignores them. */
  #modeRows{display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:auto}
  .modeRow{display:flex;gap:7px;justify-content:center}
  #modeRows:not(.open) .modeRow{display:none}
  #modeSummary{border-color:transparent;background:transparent;color:var(--dim)}
  #modeRows.open #modeSummary{color:#eaf6fc}
  .modeChip{pointer-events:auto;cursor:pointer;border:1px solid rgba(160,210,232,.22);border-radius:6px;background:rgba(6,14,22,.55);color:rgba(214,236,246,.6);font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.24em;padding:11px 16px;-webkit-tap-highlight-color:transparent;transition:color .16s ease,border-color .16s ease,box-shadow .16s ease;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .modeChip.on{color:#eafaff;border-color:rgba(140,226,255,.9);background:rgba(16,52,70,.62);box-shadow:0 0 16px rgba(103,216,255,.4),0 0 0 1px rgba(140,226,255,.35) inset}
  /* Phase J: the DAILY RUN has one difficulty; the row is shown locked, never captioned. */
  .modeChip.locked{pointer-events:none;opacity:.32}
  .modeChip.locked.on{opacity:.9}
  /* Phase 1.4: a single "something new" dot on YOUR READING, clears on open. */
  #openCurve{position:relative}
  #openCurve.hasNews::after{content:'';position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--ice);box-shadow:0 0 6px rgba(103,216,255,.8)}
  #titleGoals{display:flex;flex-direction:column;gap:9px;align-items:center}
  #titleStreak{font-size:8px;font-weight:600;letter-spacing:.24em;color:var(--dim)}
  /* RC13.8 — the streak flame: cabinet cyan (warm hues are reserved), sized
     by tier, a white core from two weeks, embers when today is unplayed. */
  #titleStreak[data-tier]{display:flex;align-items:center;gap:6px;color:#bff0ff}
  #titleStreak .flame{height:calc(14px + var(--ft,0) * 4px);width:auto;overflow:visible;transform-origin:50% 100%;
    filter:drop-shadow(0 0 calc(3px + var(--ft,0) * 3px) rgba(103,216,255,.8));animation:flameLick 1.6s ease-in-out infinite}
  #titleStreak .fOut{fill:#3fb4e8}
  #titleStreak .fIn{fill:#bff0ff}
  #titleStreak[data-tier="2"]{--ft:1}#titleStreak[data-tier="3"]{--ft:2}
  #titleStreak[data-tier="4"]{--ft:3}#titleStreak[data-tier="5"]{--ft:4}
  #titleStreak[data-tier="4"] .fIn,#titleStreak[data-tier="5"] .fIn{fill:#fff}
  #titleStreak[data-tier="5"] .fOut{fill:#67d8ff}
  #titleStreak.ember{color:var(--dim)}
  #titleStreak.ember .flame{filter:none;opacity:.55;animation:none;transform:scaleY(.7)}
  #titleStreak.ember .fIn{fill:#3fb4e8}
  @keyframes flameLick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.96,1.06) skewX(-3deg)}65%{transform:scale(1.03,.95) skewX(2deg)}}
  @media (prefers-reduced-motion:reduce){#titleStreak .flame{animation:none}}
  #app.calm #titleStreak .flame{animation:none}
  /* RC10.3 — what the ledger has been quietly doing. One line, and only once
     there is something to say: the spaced repetition under this game is its
     best idea and it accumulated where nobody could see it. */
  #titleMastery{font-size:8px;font-weight:800;letter-spacing:.24em;color:#8be4ff;opacity:.72}
  #titleMastery:empty{display:none}
  /* RC9.4 — what the DAILY RUN actually is, once. The chip names the mode;
     this says the three facts that make it worth choosing, and it retires
     the first time the player finishes one. */
  #dailyNote{display:none;font-size:8px;font-weight:800;letter-spacing:.24em;
    color:rgba(139,228,255,.62);margin-top:-2px}
  #dailyNote.on{display:block}
  .goalRow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  /* Goals are three targets, not three sentences: no chrome, just numbers. */
  .goalChip{font-size:9px;font-weight:600;letter-spacing:.16em;color:var(--dim)}
  .goalChip.done{color:#8be4ff;font-weight:800}
  .goalChip.done::before{content:'✓';margin-right:5px;opacity:.75}
  /* The recap used to be four sentences, one per wrong read. It is now two
     labelled rows — the label carries what the sentence used to say, and
     the true spelling still sits beside the misspelling that lost it. */
  #deathRecap{margin-top:20px;display:flex;flex-direction:column;gap:11px;align-items:stretch;width:min(88%,360px)}
  .recapRow{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:baseline;text-align:left}
  .recapRow .k{font-size:8px;font-weight:600;letter-spacing:.24em;color:var(--dimmer);padding-top:2px}
  .recapRow .v{font-size:14px;font-weight:600;letter-spacing:-.01em;color:rgba(242,250,254,.92);word-spacing:.16em}
  .recapRow .v b{color:#a8ecff;font-weight:800}
  .recapRow .v s{color:rgba(255,150,142,.75);text-decoration-thickness:1.5px;margin-right:3px}
  .recapRow .v em{font-style:normal;color:var(--dimmer);font-size:11px}
  #deathRecap .clean{font-size:13px;font-weight:800;letter-spacing:.24em;color:#8be4ff;text-align:center;margin:2px 0}
  /* Broadcast stat bar: number over label, three columns, one hairline. */
  .recapHead{font-size:11px;font-weight:800;letter-spacing:.24em;color:#dcecf7;margin:2px 0 -2px}
    .missedOpen{pointer-events:auto;cursor:pointer;border:1px solid rgba(139,228,255,.3);border-radius:2px;background:rgba(18,42,54,.35);color:#8be4ff;font-family:inherit;font-size:9px;font-weight:800;letter-spacing:.24em;padding:10px 14px;margin:2px auto 0}
  .missedOpen:active{background:rgba(28,62,78,.6)}
  /* RC-2: the default card is five moments — score, celebration, goals,
     misses, play again. Goals read at arm's length: one headline count and
     a big ✓/○ per goal. Everything analytical folds behind MORE STATS. */
  .goalHead{font-size:8px;font-weight:800;letter-spacing:.24em;color:var(--dimmer);text-align:center;margin-top:6px}
  .goalList{display:flex;flex-direction:column;gap:9px;margin:0 auto}
  .goalCheck{display:flex;gap:12px;align-items:center;text-align:left}
  .goalCheck i{font-style:normal;flex:0 0 22px;width:22px;height:22px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);border-radius:50%;font-size:11px;color:var(--dimmer)}
  .goalCheck.done i{border-color:rgba(139,228,255,.7);background:rgba(18,42,54,.55);color:#8be4ff;font-weight:800}
  #deathRecap .goalCheck .goalChip{font-size:11px;letter-spacing:.16em;color:rgba(232,244,251,.5)}
  #deathRecap .goalCheck .goalChip.done{color:#bff0ff;font-weight:800}
  #deathRecap .goalCheck .goalChip.done::before{content:none}
  /* Reserved-hue check: gold (~41°) collides with the 28° and 45° reserved
     accents — the reward celebrates in the card's own cyan instead. */
  .rewardLine{font-size:14px;font-weight:800;letter-spacing:.16em;color:#8be4ff;text-align:center;margin-top:3px}
  .moreStats{pointer-events:auto;cursor:pointer;border:0;background:transparent;color:var(--dimmer);font-family:inherit;font-size:8px;font-weight:800;letter-spacing:.24em;padding:11px;margin:2px auto 0}
  .moreStats:active{color:#cfeaf6}
  #deepStats{display:flex;flex-direction:column;gap:11px;align-items:stretch}
  #deepStats[hidden]{display:none}
  /* The footnote share row belongs to the analysis, not the five moments. */
  #deathScreen #shotBtns,#deathScreen #momentSlot{display:none}
  #deathScreen.deepOpen #shotBtns{display:flex}
  #deathScreen.deepOpen #momentSlot{display:block}
  #missedPanel{position:absolute;inset:0;z-index:44;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(4,7,11,.9);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);pointer-events:auto}
  #missedPanel.on{display:flex}
  #missedPanel .mCard{width:min(90%,380px);max-height:78%;overflow-y:auto;text-align:left}
  #missedPanel .mTitle{font-size:11px;font-weight:800;letter-spacing:.24em;color:#dcecf7;text-align:center;margin-bottom:16px}
  /* RC9.1 — one row per miss, read in one glance. The row is a grid: the
     spelling pair on the left, the danger pips hard right, and the meaning
     and any retirement line running full width underneath. No headings: the
     struck spelling IS the statement that this player fell for it, and its
     absence is the statement that a real word went past. */
  #missedPanel .mRow{display:grid;grid-template-columns:1fr auto;align-items:baseline;
    column-gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  #missedPanel .mPair{font-size:16px;font-weight:800;letter-spacing:-.01em;color:#eaf6fc;
    display:flex;flex-wrap:wrap;align-items:baseline;gap:0 14px}
  #missedPanel .mFake{color:rgba(232,244,251,.42);text-decoration-thickness:1.5px;font-weight:600}
  #missedPanel .mReal{color:#eaf6fc;font-weight:800}
  /* The letters that actually moved. Exactly those, in the semantic pair the
     plate uses — ui/access.js republishes both for every colour-vision mode,
     so the marks never come down to red against green. */
  #missedPanel .mPair i{font-style:normal;font-weight:800}
  #missedPanel .mFake i{color:var(--sem-wrong,#ff2a1f)}
  #missedPanel .mReal i{color:var(--sem-right,#57e389)}
  /* A dropped or doubled letter leaves one side of the pair with nothing to
     paint. On the MISSPELLING that gap is the lesson and gets drawn — a thin
     rule where the missing letter belongs. On the TRUE spelling it is drawn
     as nothing at all, deliberately: this panel exists to leave a player with
     the right shape of the word, and a mark interpolated into a correctly
     spelled word teaches the wrong one. 'winter' is 'winter', never 'win-ter'. */
  #missedPanel .mFake i:empty{display:inline-block;width:.42em;height:2px;
    vertical-align:.12em;margin:0 .04em;background:var(--sem-wrong,#ff2a1f)}
  #missedPanel .mReal i:empty{display:none}
  #missedPanel .mBeat{grid-column:1/-1;margin-top:4px;font-size:9px;font-weight:800;
    letter-spacing:.24em;color:var(--sem-right,#57e389)}
  #hud .row > div:first-child{position:relative}
  #dist.cut{animation:scoreCut .5s ease-out}
  @keyframes scoreCut{0%{color:#ff968e;transform:scale(1)}45%{color:#ff968e;transform:scale(.94)}100%{color:inherit;transform:scale(1)}}
  .scoreCut{position:absolute;left:0;top:18px;white-space:nowrap;font:800 15px/1 var(--face);letter-spacing:-.01em;
    color:rgba(255,150,142,.95);pointer-events:none;animation:scoreCutRise 1.5s ease-out forwards}
  @keyframes scoreCutRise{0%{opacity:0;transform:translateY(4px)}18%{opacity:1;transform:translateY(0)}
    100%{opacity:0;transform:translateY(-16px)}}
  #missedPanel .mRisk{display:inline-flex;gap:3px;margin-left:9px;vertical-align:middle;position:relative;top:-1px}
  #missedPanel .mRisk i{width:4px;height:4px;border-radius:50%;background:rgba(232,244,251,.16)}
  #missedPanel .mRisk i.on{background:rgba(139,228,255,.55)}
  #missedPanel .mRisk.mid i.on{background:rgba(255,214,124,.7)}
  #missedPanel .mRisk.high i.on{background:rgba(255,150,142,.8)}
  #missedPanel .mDef{grid-column:1/-1;margin-top:3px;font-size:11px;font-weight:600;line-height:1.42;color:rgba(232,244,251,.5)}
  #missedPanel .mRisk{align-self:center}
  #missedPanel .btn{display:block;width:100%;margin-top:20px}
  .defRow{font-size:11px;font-weight:600;line-height:1.42;letter-spacing:.08em;color:rgba(232,244,251,.5);text-align:left;margin-top:2px}
  .defRow b{font-weight:800;letter-spacing:.16em;color:#8be4ff;text-transform:uppercase;margin-right:7px}
  .runPlot{display:block;width:100%;height:38px;overflow:visible}
  .runPlot .rf{fill:rgba(103,216,255,.13)}
  .runPlot .rl{fill:none;stroke:var(--ice);stroke-width:.9;vector-effect:non-scaling-stroke;stroke-linejoin:round}
  .runPlot .rm{stroke-width:1.4;vector-effect:non-scaling-stroke}
  .runPlot .rm.fake{stroke:rgba(255,150,142,.82)}
  .runPlot .rm.real{stroke:rgba(232,244,251,.32)}
  .runNote{margin-top:5px;font-size:8px;font-weight:600;letter-spacing:.24em;color:var(--dimmer);text-align:center}
  .objList{display:flex;flex-direction:column;gap:7px}
  .objRow{display:grid;grid-template-columns:1fr 52px 34px;gap:9px;align-items:center}
  .objRow .ol{font-size:9px;font-weight:600;letter-spacing:.16em;color:rgba(232,244,251,.62);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .objRow .ob{height:3px;background:rgba(103,216,255,.16);overflow:hidden}
  .objRow .ob i{display:block;height:100%;background:var(--ice);transition:width .4s ease}
  .objRow .ov{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--dimmer);text-align:right}
  .objRow.done .ol{color:#bff0ff}
  .objRow.done .ob i{background:#eafcff}
  .objRow.done .ov{color:#8be4ff}
    .statBar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-top:13px;border-top:1px solid rgba(255,255,255,.1)}
  .statBar.four{grid-template-columns:repeat(4,1fr);gap:2px}
  .statBar.four b{font-size:15px}
  .statBar.four span{font-size:6.5px;letter-spacing:.16em}
  .statBar div{display:flex;flex-direction:column;gap:5px;align-items:center}
  .statBar b{font-size:17px;font-weight:800;letter-spacing:-.02em;color:#eaf6fc}
  .statBar span{font-size:7px;font-weight:600;letter-spacing:.24em;color:var(--dimmer)}
  .btn{pointer-events:auto;border:1px solid rgba(255,255,255,.18);border-radius:2px;padding:14px 24px;cursor:pointer;background:transparent;color:#eef7fb;font-family:inherit;font-size:9px;font-weight:600;letter-spacing:.24em;margin-right:-.24em;min-width:104px}
  .btn:active{background:rgba(255,255,255,.12)}
  .btn.primary{background:#f2fafd;color:#0c1216;border-color:#f2fafd;font-weight:800}
  #deathActions{display:flex;gap:10px;margin-top:22px}
  /* Everything after AGAIN is a footnote, and is sized like one. */
  /* RC9.8 — the run's best stretch, looping beside the still. It appears only
     when the run earned a standout, so an ordinary run sees no player, no
     placeholder and no button. */
  #momentClip{display:none;width:96px;height:auto;margin:14px auto 0;cursor:pointer;
    border:1px solid rgba(160,220,245,.22);background:#080c10;pointer-events:auto}
  #momentClip.on{display:block}
  #momentClip.busy{opacity:.5}
  #shotBtns{display:flex;gap:0;margin-top:14px}
  #shotBtns .btn,#copyStats{border:0;background:transparent;min-width:0;padding:8px 13px;font-size:8px;letter-spacing:.24em;color:var(--dimmer)}
  #shotBtns .btn:active,#copyStats:active{color:#cfeaf6;background:transparent}

  /* The priced continue (Phase 14): a short offer between death and the
     card. One primary button carrying its ◆ cost, a decline, a draining
     timer bar — the run resumes or the card proceeds. */
  #continueOffer{position:absolute;inset:0;z-index:38;display:none;flex-direction:column;gap:13px;align-items:center;justify-content:center;background:rgba(4,7,10,.55);pointer-events:auto}
  #continueOffer.on{display:flex}
  #continueLabel{font-size:10px;font-weight:800;letter-spacing:.34em;color:rgba(244,250,253,.85)}
  #continueTimer{width:min(48%,220px);height:3px;background:rgba(255,255,255,.12);overflow:hidden}
  #continueTimer i{display:block;height:100%;width:100%;background:#8be4ff;transform-origin:left}
  /* RC13.7 — the coin-op count: one big digit per second, punched in. */
  #continueCount{font:800 clamp(84px,30vw,150px)/.9 var(--face);letter-spacing:-.04em;color:#f4fbff;
    text-shadow:0 0 32px rgba(103,216,255,.6),0 4px 20px rgba(2,6,10,.8);font-variant-numeric:tabular-nums}
  #continueCount.beat{animation:contBeat .3s cubic-bezier(.2,1.5,.4,1)}
  #continueCount.urgent{color:#fff6c8;text-shadow:0 0 34px rgba(255,226,140,.7),0 4px 20px rgba(2,6,10,.8)}
  @keyframes contBeat{0%{transform:scale(1.45);opacity:.4}100%{transform:scale(1);opacity:1}}
  #continueLabel{font-size:13px!important;letter-spacing:.34em!important}
  #continueBalance{font-size:8px;font-weight:800;letter-spacing:.24em;color:rgba(235,247,252,.55)}

  /* RC6: the corner sound button retires — MUSIC and SFX are two rows in the
     one ⚙ sheet (RC5), so this was a third control for a setting that already
     had a home. The node stays: main and the sheet both keep its label in
     sync, and nothing has to learn a new owner. */
  #mute{display:none!important;position:absolute;z-index:80;top:calc(var(--safe-t) + 9px);right:9px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(159,216,255,.1);color:#cfe9f7;font-size:14px;cursor:pointer;pointer-events:auto;display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  /* Phase L HUD pass: while the run is LIVE the only chrome is PAUSE — the
     sound, settings and shop buttons return the moment the game stops
     (pause menu, title, results), so nothing is lost, only deferred. The
     class is driven from the frame loop in main.js. */
  /* RC7: REDUCED FLASH keeps the ring, drops the pulse. */
  #app.rf .v1MobileAction.teachRing{animation:none}
  /* RC10.2 — the legibility treatment, on the surfaces that carry actual
     WORDS. A player who raised either plate dial is telling you something
     about the whole screen, not just the plate, so the prose follows: the
     hyperlegible face the plate already uses, a size floor on the smallest
     lines, and the extreme display tracking eased where it is applied to a
     sentence rather than to a label. Deliberately NOT a global --face swap:
     the cabinet and the HUD are chrome laid out to the display
     face's metrics, and re-setting them would move furniture to fix reading.
     One class, written by access.js's apply(), and nothing else. */
  #app.readable #coach,
  #app.readable #guidedTeach .gtMain,
  #app.readable #rc7Onboarding .rule,
  #app.readable #rc7Onboarding .rule span,
  #app.readable #missedPanel .mPair,
  #app.readable #missedPanel .mDef,
  #app.readable #deathRecap{font-family:var(--plate),var(--face);letter-spacing:.08em}
  #app.readable #coach{font-size:13px;letter-spacing:.08em}
  #app.readable #rc7Onboarding .rule{font-size:14px;line-height:1.55}
  #app.readable #rc7Onboarding .rule span{font-size:13px;line-height:1.5}
  #app.readable #missedPanel .mPair{font-size:18px}

  /* RC9.9 — the held breath. A stop freezes the world; these five things are
     still true, so they brighten and dim together on the music's two-bar
     phrase (0.34 Hz at the score's 164 BPM, half the 0.6 Hz ceiling). Light
     only — nothing moves, nothing steps, and REDUCED FLASH never adds the
     class, so every one of them holds LIT rather than holding dark. The ring
     drops its own 1.1s pulse for the duration: one rhythm on screen, not two.
     main.js is the single writer of --breath. */
  #app.breathing #guidedTeach .gtMain{opacity:calc(.72 + .28 * var(--breath,1))}
  #app.breathing #barMarks i.lit{opacity:calc(.55 + .45 * var(--breath,1))}
  #app.breathing #vitals .heartPip:not(.empty) .hFill{opacity:calc(.62 + .38 * var(--breath,1))}
  #app.breathing #dist{text-shadow:
    0 0 calc(10px + 16px * var(--breath,1)) rgba(103,216,255,calc(.18 + .26 * var(--breath,1))),
    0 1px 2px rgba(2,6,10,.85)}
  #app.breathing .v1MobileAction.teachRing{animation:none;
    box-shadow:0 0 0 3px rgba(139,228,255,calc(.50 + .45 * var(--breath,1))),
      0 0 calc(18px + 22px * var(--breath,1)) rgba(103,216,255,calc(.30 + .30 * var(--breath,1)))}
  #app.chromeless #mute,#app.chromeless #accessBtn,#app.chromeless #shopBtn{display:none}
  /* RC7.1: and no chrome at all over the results card — the gear is a
     title action. AGAIN and MENU are the only ways off this screen. */
  #app.carded #accessBtn,#app.carded #shopBtn,#app.carded #mute{display:none}
  /* RC-5: on a touch device the DASH button's own ring IS the charge meter,
     and the bottom bar sat under it — two tells for one mechanic, with the
     button overlapping the bar. The bar is hidden wherever the ring exists;
     a mouse/keyboard player has no ring, so there it stays exactly as it was.
     The reward-bar readout moves out of the meter's label so it survives. */
  /* RC5: the charge bar is hidden wherever the DASH button's ring is the
     tell. RC8.1: with the marks moved out, nothing is left in that column on
     touch — so the whole zone goes, rather than reserving a row for a
     readout that no longer lives there. */
  @media (pointer:coarse){
    .meter-zone{display:none}
    /* Clear of the 76px DASH button and its safe-area offset. */
    #barMarks{bottom:calc(max(20px, var(--safe-b) + 16px) + 86px)}
  }
  /* The short-landscape control row shrinks the button to 66px and drops it. */
  @media (pointer:coarse) and (orientation:landscape) and (max-height:500px){
    #barMarks{bottom:calc(max(12px, var(--safe-b) + 8px) + 76px)}
  }
  @media(min-width:760px) and (orientation:landscape){#hud{padding-left:28px;padding-right:28px}#meterWrap{max-width:560px;margin:0 auto}.title-lockup{margin-top:8vh}}

  /* ── RC9.3 — the cabinet ──────────────────────────────────────────────
     On any screen wider than it is tall, the play area keeps its PORTRAIT
     proportion and the rest of the window becomes a bezel. The game is a
     vertical-screen game: stretched across a landscape window the road
     flattens toward the horizon, the plate has to shrink to stay inside the
     frame, and the whole reading standard — measured at 390x844 — stops
     describing what anyone is looking at. Framing costs nothing and keeps
     every measurement true, which is why the sim and the camera see the
     same rectangle here as on a phone.

     #app IS the stage. Every overlay in the build is already absolutely
     positioned against it, so framing #app frames all of them at once with
     no DOM surgery — and the translate that centres it makes #app the
     containing block for `position:fixed` descendants too, so the teach band
     and the touch buttons land inside the frame rather than across the
     window. The bezel is <body>, and nothing in it is interactive. */
  @media (min-aspect-ratio: 1/1){
    body{background:var(--bezel)}
    /* Nothing paints outside the screen. The launch veil's streaks are drawn
       far wider than the frame on purpose (they have to cross a landscape
       phone), and unclipped they crossed the bezel with them. */
    #app{overflow:hidden;container-type:size}
    /* Type that was sized against the WINDOW is sized against the CABINET.
       `vw` meant "of the play area" in every one of these and the two were
       the same rectangle until now; widths could simply become percentages,
       but a font-size cannot, so the framed case restates them in `cqw`. */
    #dist{font-size:clamp(30px,11cqw,66px)}
    #bandName{font-size:clamp(16px,5cqw,28px)}
    .big{font-size:clamp(68px,28cqw,170px)}
    /* RC13.6/13.7: the arcade readouts, sized against the cabinet. */
    #rankStamp{font-size:clamp(40px,12cqw,58px)}
    #tally b{font-size:clamp(20px,6cqw,28px)}
    #continueCount{font-size:clamp(84px,30cqw,150px)}
    #launchCount{font-size:clamp(64px,22cqw,140px)}
    .scorePop{font-size:clamp(18px,5cqw,28px)}
    #titleWordmark{max-height:clamp(120px,36cqw,300px)}
      #titleStrap{font-size:clamp(9px,2.4cqw,12px)}
    #keyLegend{gap:clamp(14px,6cqw,44px)}
    /* The DASH meter keeps the row above the legend, the way it keeps the row
       above the DASH button on a phone. */
    #hud{padding-bottom:calc(var(--safe-b) + 92px)}
    /* The legend stands where the touch buttons would, so the bar marks take
       the row above it exactly as they take the row above the DASH button. */
    #barMarks{bottom:calc(var(--safe-b) + 132px)}
    /* The frame's geometry as tokens, so anything that has to live BESIDE the
       cabinet (the tuning panel) can be exactly as wide as the bezel allows
       instead of guessing at a laptop's. Undefined outside this block, which
       is correct: on a phone there is no bezel to sit in. */
    :root{
      --app-w:min(100vw, calc(100dvh * var(--cab-aspect)));
      --bezel-w:calc((100vw - var(--app-w)) / 2);
    }
    #app{
      width:var(--app-w);
      height:100dvh;
      top:0;left:50%;transform:translateX(-50%);
      /* RC13.3 — the cabinet's screen surround: a lit T-molding edge, a dark
         bezel ring, then the cabinet's own shadow. */
      box-shadow:0 0 0 2px rgba(103,216,255,.42),0 0 18px 2px rgba(103,216,255,.28),
        0 0 0 12px #04080c,0 0 0 13px rgba(140,190,215,.16),0 0 120px 20px rgba(0,0,0,.85);
    }
    /* The cabinet's bezel: dark, vignetted toward the screen. (RC13.3's key-art
       side panels came out at the 10/8 playtest — the screen stands alone.) */
    /* `html body` + !important: the standalone shell below paints both
       html and body with the bare --bezel colour, and it must not win here. */
    html body{background:
      linear-gradient(90deg,rgba(3,6,10,.42) 0%,rgba(3,6,10,.7) calc(var(--bezel-w) * .62),rgba(3,6,10,.98) calc(var(--bezel-w) - 8px),
        transparent var(--bezel-w),transparent calc(100% - var(--bezel-w)),
        rgba(3,6,10,.98) calc(100% - var(--bezel-w) + 8px),rgba(3,6,10,.7) calc(100% - var(--bezel-w) * .62),rgba(3,6,10,.42) 100%),
      radial-gradient(120% 80% at 50% 50%,transparent 55%,rgba(2,4,7,.65) 100%),
      var(--bezel)!important}
  }
  /* The bezel and the frame's proportion, as tokens.
     390x844 (0.4621) is the viewport every reading measurement in this build
     was taken at, and it was the cabinet's proportion too — which meant a
     1920x1080 desktop played a 469px column with 725px of dead bezel either
     side, in full screen included. The camera's FOV is VERTICAL, so at a fixed
     frame height a wider frame renders a word plate at EXACTLY the same size
     and only reveals more of the world beside the road: measured at 17.18
     px/m at 0.4621, 0.62 and 0.80 alike. So the cabinet widens to 0.80 — the
     screen it can fill without becoming a letterbox — and the phone, which is
     narrower than that, is untouched. */
  :root{--bezel:#080c10;--cab-aspect:0.80}
  /* Full screen means full screen. A player who asks for it is asking for the
     window's pixels, not for a wider bezel. (The FOV widens with the aspect
     here, costing 4% of plate size against the cabinet — and still far more
     plate than any phone.) */
  html:fullscreen #app,html:-webkit-full-screen #app{width:100vw}
  /* RC11.8: the marquee is gone. A lit name over the screen is what a cabinet
     does when nobody is playing — but this cabinet's attract loop and title
     already carry the wordmark, so the header only ever repeated the word
     directly beneath it, and it charged 64px of the play area for the echo.
     The bezel holds nothing now, which is also the simplest thing it can be. */
  /* ── The keyboard legend ──────────────────────────────────────────────
     Where the touch buttons would be, because that is where a player's eye
     goes looking for the controls. Each glyph dims for good once its control
     has been used — the same bargain the coach's lessons make, and the
     reason a cabinet does not need a manual. */
  #keyLegend{display:none;position:absolute;left:0;right:0;
    bottom:calc(var(--safe-b) + 16px);z-index:23;pointer-events:none;
    justify-content:center;align-items:flex-end;gap:clamp(18px,6vw,44px)}
  #keyLegend.on{display:flex}
  #keyLegend div{display:flex;flex-direction:column;align-items:center;gap:6px;
    opacity:.85;transition:opacity .45s ease}
  #keyLegend div.used{opacity:.16}
  #keyLegend i{font-style:normal;display:grid;place-items:center;
    min-width:34px;height:30px;padding:0 9px;border:1px solid rgba(160,220,245,.30);
    border-radius:3px;font:800 14px/1 var(--face);color:rgba(214,240,252,.9)}
  #keyLegend span{font:800 8px/1 var(--face);letter-spacing:.24em;color:var(--dimmer)}

/* The standalone/mobile shell: every fullscreen layer owns the complete
   dynamic viewport, including the iOS home-indicator region. RC9.3 split it
   by aspect — taller than wide fills the window; wider than tall is framed
   as a vertical cabinet, which these rules must not force back to 100vw.
   The shell colour is the --bezel token: framed, it IS the bezel. (This was
   injected at runtime by src/v1-viewport.js; it is ordinary CSS now.) */
    html,body{
      width:100%!important;
      height:100%!important;
      min-height:100dvh!important;
      background:var(--bezel,#080c10)!important;
    }
    body{
      position:fixed!important;
      inset:0!important;
      overflow:hidden!important;
    }
    #app{
      position:fixed!important;
      background:var(--bezel,#080c10)!important;
    }
    @media (max-aspect-ratio: 1/1){
      #app{
        inset:0!important;
        width:100vw!important;
        height:100dvh!important;
        min-height:100dvh!important;
      }
      .screen,#rc2Pause,#rc7Onboarding{
        min-height:100dvh!important;
      }
    }
    /* Framed: the screens fill the CABINET, which is what #app now is. */
    @media (min-aspect-ratio: 1/1){
      .screen,#rc2Pause,#rc7Onboarding{
        min-height:100%!important;
      }
    }
    #rc2Pause,#rc7Onboarding{
      position:absolute!important;
      inset:0!important;
    }
    #rc2Pause{
      padding-bottom:max(24px,env(safe-area-inset-bottom,0px))!important;
    }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="grade"></div>
  <div id="staticVeil"></div><div id="dread"></div><div id="dreadRed"></div><div id="fur"></div><div id="flash"></div><div id="drain"></div><div id="drainDim"></div>
  <div id="bandName"></div><div id="coach"></div><div id="powerHint"></div>
  <div id="barMarks" role="img" aria-label="Reward bar 0 of 3"><i></i><i></i><i></i></div>
  <div id="keyLegend" aria-hidden="true"></div>

  <div id="routeStrip" aria-hidden="true"><i></i></div>
  <div id="hud">
    <div><div class="row"><div><div id="dist">0</div><div id="distSub">0 M</div><div id="distTarget"></div><div id="vitalsSlot"></div></div><div id="best" hidden><span>BEST TODAY</span><b id="bestVal">—</b></div></div><div id="chain"></div></div>
    <div class="meter-zone"><div id="meterLabel"><span class="mLabel">DASH</span><i></i></div><div id="meterWrap"><div id="meter"></div></div></div>
  </div>

  <div id="judge" aria-hidden="true"></div>
  <div id="combo" aria-hidden="true"></div>
  <div id="dashFlare" aria-hidden="true"></div>
  <div id="pressTell" aria-hidden="true"></div>

  <button id="mute" aria-label="Toggle sound">♪</button>

  <div class="screen on" id="titleScreen">
    <div class="title-lockup">
      <!-- Inline, not an <img>: an SVG loaded through <img> is an isolated
           document that cannot see the page's @font-face, so an external
           wordmark could only ever be set in a system fallback. Inlined it
           uses the same bundled Archivo as the rest of the UI, and costs one
           request less. The chromatic echo — cyan behind, Redline red behind
           that — is the identity. -->
      <svg id="titleWordmark" viewBox="0 0 1000 400" role="img" aria-label="DICTION DASH" preserveAspectRatio="xMidYMid meet">
        <g font-family="var(--face)" font-weight="600" fill="#f4fbff" text-anchor="middle">
          <text x="500" y="170" font-size="176" letter-spacing="10">DICTION</text>
          <text x="276" y="372" font-size="188">D</text>
          <text x="606" y="372" font-size="188">S</text>
          <text x="772" y="372" font-size="188">H</text>
        </g>
        <!-- The A is the mark: a chevron of light — the runner's crest, the
             caret, the Λ on the runner's chest. -->
        <path class="wmChevron" d="M 362 372 L 442 226 L 522 372" fill="none" stroke="#67d8ff" stroke-width="24" stroke-linejoin="miter" stroke-linecap="butt"/>
      </svg><div id="titleHint"></div></div>
    <div class="drop-lockup"><div class="drop">BEGIN RUN</div><div id="modeRows"><div class="modeRow" id="modeRow"><button class="modeChip" type="button" data-mode="endless">ENDLESS</button><button class="modeChip" type="button" data-mode="standard">DAILY RUN</button></div><div class="modeRow" id="difficultyRow"><button class="modeChip" type="button" data-difficulty="easy">EASY</button><button class="modeChip" type="button" data-difficulty="normal">NORMAL</button><button class="modeChip" type="button" data-difficulty="hard">HARD</button></div></div><div id="titleGoals"><div id="dailyNote"></div><div class="goalRow" id="titleGoalRow"></div><div id="titleStreak"></div><div id="titleMastery"></div></div><div class="seed" id="seedLine"></div></div>
    <div id="titleStrap" aria-hidden="true"></div>
  </div>

  <div class="screen" id="deathScreen">
    <img id="shot" alt="The moment you were redacted">
    <div id="deathTag">RUN OVER</div>
    <div class="big"><span id="finalDist">0</span></div>
    <div class="pb" id="pbTag" style="visibility:hidden">NEW BEST</div>
    <div id="tally" aria-label="Run tally"><span><b data-k="reads">0</b>READS</span><span><b data-k="perfects">0</b>PERFECT</span><span><b data-k="chain">0</b>CHAIN</span><span id="rankStamp" aria-live="polite"></span></div>
    <div id="deathRecap"></div>
    <div class="stats" id="deathStats"></div>
    <div id="initialsRow"></div>
    <div id="deathActions"><button class="btn primary" id="deathAgain" data-rc2-ui>AGAIN</button><button class="btn" id="deathMenu" data-rc2-ui>MENU</button></div>
    <div id="momentSlot"></div>
    <div id="shotBtns"><button class="btn" id="saveShot" data-rc2-ui>SAVE</button><button class="btn" id="copyStats" data-rc2-ui>STATS</button></div>
    <div class="seed" id="deathSeed"></div>
  </div>

  <!-- Playtest: the missed-word teaching cluttered the results card, so it
       lives here now — one line to open it, and room for the definitions the
       card could never fit. -->
  <div id="missedPanel">
    <div class="mCard">
      <div class="mTitle">MISSED WORDS</div>
      <div id="missedBody"></div>
      <button class="btn" id="missedClose" data-rc2-ui>DONE</button>
    </div>
  </div>

  <div id="continueOffer">
    <div id="continueLabel">CONTINUE?</div>
    <div id="continueCount" aria-live="off">9</div>
    <button class="btn primary" id="continueBuy" data-rc2-ui>CONTINUE ◆30</button>
    <button class="btn" id="continuePass" data-rc2-ui>LET IT END</button>
    <div id="continueTimer"><i></i></div>
    <div id="continueBalance"></div>
  </div>
</div>
<!-- RC10.4: one entry point, and it waits for a paint. The title is written
     out below and needs no JavaScript to be looked at; evaluating the game's
     module graph is a single unbroken task on a slow phone, and a browser
     cannot paint in the middle of one. src/boot.js imports both of these
     after a real frame has been presented. -->
<script type="module" src="/src/boot.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
