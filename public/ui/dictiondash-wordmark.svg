<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1545 300" role="img" aria-labelledby="title" preserveAspectRatio="xMidYMid meet"><title id="title">DICTION DASH</title>
  <!-- Phase 19: the wordmark was set in the same monospace the whole UI
       used, so it read as a terminal caption rather than a title card. It
       is now the platform display grotesque the rest of the UI uses, at a
       broadcast weight and tight tracking, keeping the chromatic echo
       (cyan behind, Redline red behind that) as the identity. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
     font-size="190" font-weight="800" letter-spacing="-4" text-anchor="middle">
    <text x="762" y="200" fill="#67d8ff" opacity="0.5">DICTION DASH</text>
    <text x="768" y="203" fill="#ff2a1f" opacity="0.28">DICTION DASH</text>
    <text x="774" y="206" fill="#f4fbff">DICTION DASH</text>
  </g>
</svg>
