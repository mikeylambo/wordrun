name: Gates

# The same suites the pre-commit hook runs, plus the v1 release gates, on
# every push and PR. (Replaces the GPT-v1-RC workflow, whose rc*-gates files
# were folded away and no longer exist.)

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run gates
      - run: npm run gate:v1
